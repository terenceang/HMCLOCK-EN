<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HM CLOCK</title>
  <script>
    // 在首次渲染前应用已保存的主题(或系统偏好)，避免出现主题闪烁
    (function() {
      const stored = localStorage.getItem('hmclock-theme') || 'system';
      const isDark = stored === 'dark' || (stored === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.classList.toggle('dark', isDark);
    })();
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind 配置 -->
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#3B82F6',
            secondary: '#10B981',
            accent: '#8B5CF6',
            warning: '#F59E0B',
            danger: '#EF4444',
            dark: '#1E293B',
            light: '#F8FAFC'
          },
          fontFamily: {
            inter: ['Inter', 'sans-serif'],
          },
        },
      }
    }
  </script>
  
  <style type="text/tailwindcss">
    @layer utilities {
      .content-auto {
        content-visibility: auto;
      }
      .btn-hover {
        @apply transition-all duration-300 hover:shadow-lg transform hover:-translate-y-0.5;
      }
      .card-effect {
        @apply bg-white dark:bg-slate-800 rounded-xl shadow-md hover:shadow-lg dark:shadow-black/40 transition-all duration-300;
      }
      .text-gradient {
        @apply bg-clip-text text-transparent bg-gradient-to-r from-primary to-accent;
      }
    }
  </style>
  
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f0f9ff;
      background-image:
        radial-gradient(at 40% 20%, rgba(59, 130, 246, 0.05) 0px, transparent 50%),
        radial-gradient(at 80% 0%, rgba(139, 92, 246, 0.05) 0px, transparent 50%),
        radial-gradient(at 0% 50%, rgba(16, 185, 129, 0.05) 0px, transparent 50%);
    }

    .dark body {
      background-color: #0f172a;
      background-image:
        radial-gradient(at 40% 20%, rgba(59, 130, 246, 0.08) 0px, transparent 50%),
        radial-gradient(at 80% 0%, rgba(139, 92, 246, 0.08) 0px, transparent 50%),
        radial-gradient(at 0% 50%, rgba(16, 185, 129, 0.08) 0px, transparent 50%);
    }
    
    .log-entry {
      animation: fadeIn 0.3s ease-in-out;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .pulse {
      animation: pulse 2s infinite;
    }
    
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
  </style>
</head>

<body class="min-h-screen p-4 md:p-6 flex justify-center items-start font-inter text-dark dark:text-slate-100 transition-colors duration-300">
  <div class="w-full max-w-4xl">
    <!-- 头部标题 -->
    <header class="mb-6 text-center">
      <h1 class="text-[clamp(1.8rem,4vw,2.5rem)] font-bold text-gradient mb-2">HM CLOCK 控制中心</h1>
    </header>
    
    <!-- 主内容卡片 -->
    <div class="card-effect p-5 md:p-6 space-y-6">
      <!-- 控制按钮区域 -->
      <div class="flex flex-wrap gap-3 md:gap-4">
        <!-- 初始为禁用状态，确认存在蓝牙适配器后才启用 -->
        <button id="connect-button" class="bg-primary text-white px-5 py-2.5 rounded-lg flex items-center gap-2 btn-hover font-medium opacity-50 cursor-not-allowed" disabled>
          <i class="fa fa-bluetooth"></i> 连接设备
        </button>
        <button id="setime-button" class="bg-warning text-white px-5 py-2.5 rounded-lg flex items-center gap-2 btn-hover font-medium opacity-50 cursor-not-allowed" disabled>
          <i class="fa fa-clock-o"></i> 同步时间
        </button>
        <button id="upfirm-button" class="bg-accent text-white px-5 py-2.5 rounded-lg flex items-center gap-2 btn-hover font-medium opacity-50 cursor-not-allowed" disabled>
          <i class="fa fa-refresh"></i> 固件升级
        </button>
        <button id="calibration-button" class="bg-secondary text-white px-5 py-2.5 rounded-lg flex items-center gap-2 btn-hover font-medium opacity-50 cursor-not-allowed" disabled>
          <i class="fa fa-wrench"></i> 时间校准
        </button>
        <button id="cardview-button" class="bg-primary text-white px-5 py-2.5 rounded-lg flex items-center gap-2 btn-hover font-medium">
          <i class="fa fa-th-large"></i> 卡片视图
        </button>
        <button id="theme-button" class="bg-slate-600 text-white px-5 py-2.5 rounded-lg flex items-center gap-2 btn-hover font-medium">
          <i class="fa fa-desktop"></i> 跟随系统
        </button>
      </div>

      <!-- 蓝牙可用性/连接错误提示横幅 -->
      <div id="bt-status" class="hidden"></div>

      <!-- 时钟卡片视图: 左侧模拟时钟, 右侧仿 iOS 日历图标 -->
      <div id="clock-card-view" class="flex flex-wrap items-stretch justify-center gap-4 p-4 bg-gray-50 dark:bg-slate-900/60 rounded-lg border border-gray-100 dark:border-slate-700">
        <!-- 模拟时钟卡片 -->
        <div class="card-effect flex items-center justify-center p-4" style="width:160px;">
          <svg viewBox="0 0 200 200" width="140" height="140">
            <circle cx="100" cy="100" r="94" class="fill-white dark:fill-slate-800 stroke-slate-800 dark:stroke-slate-200" stroke-width="4"/>
            <g class="stroke-slate-800 dark:stroke-slate-200" stroke-linecap="round">
              <line x1="100" y1="10" x2="100" y2="24" stroke-width="4" transform="rotate(0 100 100)"/>
              <line x1="100" y1="10" x2="100" y2="24" stroke-width="4" transform="rotate(90 100 100)"/>
              <line x1="100" y1="10" x2="100" y2="24" stroke-width="4" transform="rotate(180 100 100)"/>
              <line x1="100" y1="10" x2="100" y2="24" stroke-width="4" transform="rotate(270 100 100)"/>
              <line x1="100" y1="10" x2="100" y2="20" stroke-width="2" transform="rotate(30 100 100)"/>
              <line x1="100" y1="10" x2="100" y2="20" stroke-width="2" transform="rotate(60 100 100)"/>
              <line x1="100" y1="10" x2="100" y2="20" stroke-width="2" transform="rotate(120 100 100)"/>
              <line x1="100" y1="10" x2="100" y2="20" stroke-width="2" transform="rotate(150 100 100)"/>
              <line x1="100" y1="10" x2="100" y2="20" stroke-width="2" transform="rotate(210 100 100)"/>
              <line x1="100" y1="10" x2="100" y2="20" stroke-width="2" transform="rotate(240 100 100)"/>
              <line x1="100" y1="10" x2="100" y2="20" stroke-width="2" transform="rotate(300 100 100)"/>
              <line x1="100" y1="10" x2="100" y2="20" stroke-width="2" transform="rotate(330 100 100)"/>
            </g>
            <line id="hour-hand" x1="100" y1="100" x2="100" y2="58" class="stroke-slate-800 dark:stroke-slate-200" stroke-width="7" stroke-linecap="round"/>
            <line id="minute-hand" x1="100" y1="100" x2="100" y2="34" class="stroke-slate-800 dark:stroke-slate-200" stroke-width="5" stroke-linecap="round"/>
            <line id="second-hand" x1="100" y1="100" x2="100" y2="22" class="stroke-red-500 dark:stroke-red-400" stroke-width="2" stroke-linecap="round"/>
            <circle cx="100" cy="100" r="6" class="fill-slate-800 dark:fill-slate-200"/>
          </svg>
        </div>

        <!-- 仿 iOS 日历图标卡片: 显示 年份/日期/星期 -->
        <div class="card-effect overflow-hidden flex flex-col" style="width:140px;">
          <div class="bg-danger text-white text-center text-sm font-bold py-1.5" id="cal-weekday">周日</div>
          <div class="flex-1 flex flex-col items-center justify-center py-4">
            <div class="text-5xl font-bold text-dark dark:text-slate-100 leading-none" id="cal-date">--</div>
            <div class="text-xs text-gray-500 dark:text-slate-400 mt-2" id="cal-year">----</div>
          </div>
        </div>
      </div>

      <!-- 设备信息区域 -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 p-4 bg-gray-50 dark:bg-slate-900/60 rounded-lg border border-gray-100 dark:border-slate-700">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center text-primary">
            <i class="fa fa-microchip"></i>
          </div>
          <div>
            <p class="text-gray-500 dark:text-slate-400 text-sm">设备名称</p>
            <p id="device_name" class="font-semibold">未连接</p>
          </div>
        </div>

        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-full bg-warning/10 flex items-center justify-center text-warning">
            <i class="fa fa-bolt"></i>
          </div>
          <div>
            <p class="text-gray-500 dark:text-slate-400 text-sm">当前电压</p>
            <p id="current_voltage" class="font-semibold">--.- V</p>
          </div>
        </div>

        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-full bg-secondary/10 flex items-center justify-center text-secondary">
            <i class="fa fa-calendar"></i>
          </div>
          <div>
            <p class="text-gray-500 dark:text-slate-400 text-sm">设备时间</p>
            <p id="current_time" class="font-semibold">--:--:--</p>
          </div>
        </div>

        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-full bg-accent/10 flex items-center justify-center text-accent">
            <i class="fa fa-laptop"></i>
          </div>
          <div>
            <p class="text-gray-500 dark:text-slate-400 text-sm">系统时间</p>
            <p id="system_time" class="font-semibold">加载中...</p>
          </div>
        </div>
      </div>

      <!-- 进度条区域 -->
      <div id="progress-container" class="hidden">
        <p class="text-sm font-medium text-gray-600 dark:text-slate-300 mb-1">固件升级进度</p>
        <div class="h-2 bg-gray-100 dark:bg-slate-700 rounded-full overflow-hidden">
          <div id="update_progress_bar" class="h-full bg-gradient-to-r from-primary to-accent w-0 transition-all duration-300"></div>
        </div>
        <p id="update_progress_text" class="text-xs text-gray-500 dark:text-slate-400 mt-1">0%</p>
        <div id="update_progress" class="hidden"></div>
      </div>

      <!-- 日志终端区域 -->
      <div class="space-y-2">
        <div class="flex justify-between items-center">
          <h3 class="font-semibold text-gray-700 dark:text-slate-300 flex items-center gap-2">
            <i class="fa fa-terminal text-primary"></i> 设备日志
          </h3>
          <button id="clear-log-btn" class="text-xs text-gray-500 dark:text-slate-400 hover:text-danger transition-colors">
            <i class="fa fa-trash-o"></i> 清空日志
          </button>
        </div>

        <div id="log-window" class="bg-gray-900 text-gray-100 text-xs md:text-sm rounded-lg h-48 md:h-64 overflow-y-auto p-3 font-mono">
          <div class="text-gray-400 log-entry">终端已启动，等待设备连接...</div>
        </div>
      </div>
    </div>

    <!-- 页脚信息 -->
    <footer class="mt-6 text-center text-xs text-gray-500 dark:text-slate-400">
      <p>HM CLOCK蓝牙控制工具 &copy; https://github.com/tpunix/HMCLOCK</p>
    </footer>
  </div>

  <script src="https://cdn.sheetjs.com/crc-32-latest/package/crc32.js"></script>
  
  <script>
    // 主题切换(浅色/深色/跟随系统)
    const themeButton = document.getElementById('theme-button');
    const themeOrder = ['system', 'light', 'dark'];
    const themeMeta = {
      system: { icon: 'fa-desktop', label: '跟随系统' },
      light:  { icon: 'fa-sun-o',   label: '浅色' },
      dark:   { icon: 'fa-moon-o',  label: '深色' }
    };
    let currentTheme = localStorage.getItem('hmclock-theme') || 'system';

    function applyTheme(mode) {
      const isDark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.classList.toggle('dark', isDark);
      const meta = themeMeta[mode];
      themeButton.innerHTML = `<i class="fa ${meta.icon}"></i> ${meta.label}`;
    }

    applyTheme(currentTheme);

    themeButton.addEventListener('click', () => {
      currentTheme = themeOrder[(themeOrder.indexOf(currentTheme) + 1) % themeOrder.length];
      localStorage.setItem('hmclock-theme', currentTheme);
      applyTheme(currentTheme);
    });

    // 跟随系统模式下，实时响应操作系统主题变化
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
      if (currentTheme === 'system') applyTheme('system');
    });

    // 时钟卡片视图: 左侧模拟时钟表盘, 右侧仿 iOS 日历图标(年/日期/星期)
    // 需在 updateSystemTime() 之前声明，因为该函数首次(立即)执行时就会调用 renderClockCard()
    const wdayShort = ['日', '一', '二', '三', '四', '五', '六'];
    const cardView = document.getElementById('clock-card-view');
    const cardviewButton = document.getElementById('cardview-button');
    const clockHands = {
      hour:   document.getElementById('hour-hand'),
      minute: document.getElementById('minute-hand'),
      second: document.getElementById('second-hand')
    };
    const calWeekday = document.getElementById('cal-weekday');
    const calDate = document.getElementById('cal-date');
    const calYear = document.getElementById('cal-year');
    let cardViewOn = true;

    cardviewButton.addEventListener('click', () => {
      cardViewOn = !cardViewOn;
      cardView.classList.toggle('hidden', !cardViewOn);
      cardviewButton.classList.toggle('bg-dark', !cardViewOn);
      cardviewButton.classList.toggle('bg-primary', cardViewOn);
      if (cardViewOn) {
        renderClockCard(deviceTimeBase ? deviceCurrentTime() : new Date());
      }
    });

    // 依据 deviceTimeBase 与已流逝的秒数，计算设备当前时间(用于卡片视图)
    function deviceCurrentTime() {
      const { year, month, mday, hour, minute, second, timestamp } = deviceTimeBase;
      const elapsedSeconds = Math.floor((new Date() - timestamp) / 1000);
      return new Date(year, month, mday, hour, minute, second + elapsedSeconds);
    }

    function renderClockCard(date) {
      if (!cardViewOn) return;

      const hour = date.getHours();
      const minute = date.getMinutes();
      const second = date.getSeconds();

      const secDeg = second * 6;
      const minDeg = minute * 6 + second * 0.1;
      const hourDeg = (hour % 12) * 30 + minute * 0.5;

      clockHands.second.setAttribute('transform', `rotate(${secDeg} 100 100)`);
      clockHands.minute.setAttribute('transform', `rotate(${minDeg} 100 100)`);
      clockHands.hour.setAttribute('transform', `rotate(${hourDeg} 100 100)`);

      calWeekday.textContent = '周' + wdayShort[date.getDay()];
      calDate.textContent = date.getDate().toString().padStart(2, '0');
      calYear.textContent = date.getFullYear();
    }

    // 系统时间更新
    function updateSystemTime() {
      const now = new Date();
      const timeString = now.toLocaleTimeString('zh-CN', {
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      });
      const dateString = now.toLocaleDateString('zh-CN', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit'
      });
      document.getElementById('system_time').textContent = `${dateString} ${timeString}`;

      // 未连接设备时，卡片视图以系统时间驱动
      if (!deviceTimeBase) {
        renderClockCard(now);
      }
    }

    // 初始化更新系统时间并设置定时器
    updateSystemTime();
    setInterval(updateSystemTime, 1000);
    
    // 日志系统
    const logWindow = document.getElementById('log-window');
    const clearLogBtn = document.getElementById('clear-log-btn');
    
    // 自定义日志函数
    function log(message, type = 'info') {
      const timestamp = new Date().toLocaleTimeString('zh-CN', {
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      });
      
      const logLine = document.createElement('div');
      logLine.className = 'log-entry mb-1 border-b border-gray-800 pb-1';
      
      let typeIcon = '';
      let typeColor = '';
      
      switch(type) {
        case 'success':
          typeIcon = '<span class="text-green-400 mr-1"><i class="fa fa-check-circle"></i></span>';
          typeColor = 'text-green-300';
          break;
        case 'error':
          typeIcon = '<span class="text-red-400 mr-1"><i class="fa fa-exclamation-circle"></i></span>';
          typeColor = 'text-red-300';
          break;
        case 'warning':
          typeIcon = '<span class="text-yellow-400 mr-1"><i class="fa fa-exclamation-triangle"></i></span>';
          typeColor = 'text-yellow-300';
          break;
        case 'info':
        default:
          typeIcon = '<span class="text-blue-400 mr-1"><i class="fa fa-info-circle"></i></span>';
          typeColor = 'text-gray-300';
      }
      
      logLine.innerHTML = `<span class="text-gray-500 mr-2">[${timestamp}]</span>${typeIcon}<span class="${typeColor}">${message}</span>`;
      logWindow.appendChild(logLine);
      logWindow.scrollTop = logWindow.scrollHeight;
    }
    
    // 替换console.log
    const originalLog = console.log;
    console.log = function (...args) {
      originalLog(...args);
      log(args.join(" "));
    };
    
    // 清空日志
    clearLogBtn.addEventListener('click', () => {
      logWindow.innerHTML = '<div class="text-gray-400 log-entry">日志已清空</div>';
    });

    // 本机是否有可用的蓝牙 radio。初始为 false，确保可用性检查完成前无法点击连接按钮
    let bluetoothAvailable = false;

    // 状态提示横幅
    const btStatus = document.getElementById('bt-status');

    function showStatus(message, type = 'error') {
      const palette = {
        error:   'bg-red-50 dark:bg-red-900/30 border-red-300 dark:border-red-700 text-red-800 dark:text-red-200',
        warning: 'bg-yellow-50 dark:bg-yellow-900/30 border-yellow-300 dark:border-yellow-700 text-yellow-800 dark:text-yellow-200'
      };
      const icon = type === 'warning' ? 'fa-exclamation-triangle' : 'fa-exclamation-circle';
      btStatus.className = 'rounded-lg border px-4 py-3 text-sm flex items-start gap-3 ' + palette[type];
      btStatus.innerHTML = `<i class="fa ${icon} mt-0.5"></i><div>${message}</div>`;
    }

    function hideStatus() {
      btStatus.className = 'hidden';
      btStatus.innerHTML = '';
    }

    // 启用/禁用按钮，并同步其禁用样式
    function setButtonEnabled(button, enabled) {
      button.disabled = !enabled;
      button.classList.toggle('opacity-50', !enabled);
      button.classList.toggle('cursor-not-allowed', !enabled);
    }

    // 三个依赖设备连接的操作按钮
    const deviceButtons = [
      document.getElementById('setime-button'),
      document.getElementById('upfirm-button'),
      document.getElementById('calibration-button')
    ];

    function setDeviceButtonsEnabled(enabled) {
      deviceButtons.forEach(button => setButtonEnabled(button, enabled));
    }

    // 启用/禁用连接按钮，并同步其样式
    function setConnectEnabled(enabled) {
      setButtonEnabled(document.getElementById('connect-button'), enabled);
    }

    // 针对各类失败原因，给出用户可以实际操作的提示信息
    const NO_ADAPTER_MSG = '此电脑未找到蓝牙适配器。请插入蓝牙 4.0+（BLE）USB 适配器，或改在自带蓝牙的设备上打开本页面。';
    const UNSUPPORTED_MSG = '此浏览器不支持 Web Bluetooth。请在桌面端使用 Chrome、Edge 或 Opera，或在 Android 端使用 Chrome。Firefox、Safari 以及所有 iPhone/iPad 浏览器均无法连接。';

    // 将 Web Bluetooth 的失败原因转换为用户可理解的信息
    function describeError(error) {
      const name = error && error.name;
      const message = (error && error.message) || String(error);

      if (!navigator.bluetooth) return UNSUPPORTED_MSG;
      // Chrome 将缺少蓝牙 radio 报告为 NotFoundError，与选择器为空时相同
      if (name === 'NotFoundError' && /adapter/i.test(message)) return NO_ADAPTER_MSG;
      if (name === 'NotFoundError') {
        return '未选择任何设备。选择器只列出广播名以 "DCLK" 开头的时钟——请确认时钟已上电、正在广播，且未被其他手机或电脑连接。';
      }
      if (name === 'SecurityError') {
        return '被浏览器拦截。Web Bluetooth 需要安全页面（https:// 或 localhost）；直接从本地磁盘打开此文件将无法连接。';
      }
      if (name === 'NetworkError') {
        return '与时钟的连接已断开。请靠近时钟、将其重新上电后再试。';
      }
      if (name === 'NotSupportedError') {
        return '时钟未提供预期的服务（0xff00）。固件版本可能不兼容。';
      }
      return `${name || 'Error'}: ${message}`;
    }

    // 核心功能代码
    var connected = false;
    var device = null;
    var longValue = null;
    var deviceTimeInterval = null; // 设备时间更新定时器
    var deviceTimeBase = null;     // 设备时间基准值
    
    // 格式化时间显示
    function formatTime(year, month, mday, hour, min, sec) {
      month += 1;
      return `${year}-${month.toString().padStart(2, '0')}-${mday.toString().padStart(2, '0')} ${hour.toString().padStart(2, '0')}:${min.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
    }
    
    // 更新设备时间显示(从基准值推算设备当前时间)
    function updateDeviceTime() {
      if (!deviceTimeBase) return;

      const t = deviceCurrentTime();
      document.getElementById('current_time').textContent = formatTime(
        t.getFullYear(), t.getMonth(), t.getDate(),
        t.getHours(), t.getMinutes(), t.getSeconds()
      );

      // 已连接设备时，卡片视图以设备时间驱动
      renderClockCard(t);
    }

    function onClick() {
      if(connected) { disconnect(); return; }
      // 双重保险：确认存在蓝牙 radio 后才尝试连接
      if(!bluetoothAvailable) {
        showStatus(navigator.bluetooth ? NO_ADAPTER_MSG : UNSUPPORTED_MSG);
        setConnectEnabled(false);
        return;
      }
      connectToDevice();
    }

    // 连接设备
    async function connectToDevice() {
      try {
        // 更新按钮状态
        const connectButton = document.getElementById('connect-button');
        connectButton.disabled = true;
        connectButton.innerHTML = '<i class="fa fa-spinner fa-spin"></i> 连接中...';
        
        console.log('请求设备...');
        hideStatus();
        device = await navigator.bluetooth.requestDevice({
          filters: [{ namePrefix: "DCLK" }],
          optionalServices: [ 0xff00 ]
        });
        console.log('设备名称:', device.name);
        document.getElementById('device_name').textContent = device.name;
        device.ongattserverdisconnected = onDisconnect;

        let server = await device.gatt.connect();
        console.log('设备已连接');

        let service = await server.getPrimaryService(0xff00);
        let adc1Value = await service.getCharacteristic(0xff02);
        longValue = await service.getCharacteristic(0xff01);

        let cur_voltage = await adc1Value.readValue();
        console.log('当前电压:', cur_voltage.getUint16(0, true) / 1000 + 'V');
        document.getElementById('current_voltage').textContent = (cur_voltage.getUint16(0, true) / 1000).toFixed(2) + ' V';

        let cur_time = await longValue.readValue();
        let year = cur_time.getUint16(0, true),
            month = cur_time.getUint8(2),
            mday = cur_time.getUint8(3),
            hour = cur_time.getUint8(4),
            minute = cur_time.getUint8(5),
            second = cur_time.getUint8(6);
        
        // 保存设备时间基准值和当前时间戳
        deviceTimeBase = {
          year, month, mday, hour, minute, second,
          timestamp: new Date()
        };
        
        // 立即更新设备时间显示
        updateDeviceTime();
        
        // 设置定时器每秒更新一次设备时间
        if (deviceTimeInterval) clearInterval(deviceTimeInterval);
        deviceTimeInterval = setInterval(updateDeviceTime, 1000);

        connected = true;
        setDeviceButtonsEnabled(true);

        connectButton.innerHTML = '<i class="fa fa-disconnect"></i> 断开连接';
        connectButton.disabled = false;
      } catch (error) {
        console.log('连接失败:', error);
        // 先执行 disconnect()，让下面给出的具体原因覆盖 onDisconnect() 可能
        // 设置的通用提示
        disconnect();
        showStatus(describeError(error));
      }
    }

    // 对时功能
    async function onSetTime() {
      const setimeButton = document.getElementById('setime-button');
      setimeButton.disabled = true;
      setimeButton.innerHTML = '<i class="fa fa-spinner fa-spin"></i> 同步中...';
      
      try {
        // 等待到下一秒的开始，确保发送的时间精确
        await new Promise(resolve => setTimeout(resolve, 1000 - (Date.now() % 1000)));

        let now = new Date();
        let year = now.getFullYear(),
            month = now.getMonth(),
            mday = now.getDate(),
            wday = now.getDay(),
            hour = now.getHours(),
            minute = now.getMinutes(),
            second = now.getSeconds();

        let buf = new Uint8Array(9);
        buf.set([0x91, year % 256, Math.floor(year / 256), month, mday, hour, minute, second, wday]);
        await longValue.writeValue(buf);

        // 更新设备时间基准值
        deviceTimeBase = {
          year, month: month, mday, hour, minute, second,
          timestamp: new Date()
        };
        
        // 立即更新设备时间显示
        updateDeviceTime();
        
        console.log('同步时间成功!');
      } catch (error) {
        console.log('同步时间失败:', error);
      } finally {
        setimeButton.innerHTML = '<i class="fa fa-clock-o"></i> 同步时间';
        setimeButton.disabled = false;
      }
    }

    // 文件读取辅助函数
    function readFileAsArrayBuffer(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsArrayBuffer(file);
      });
    }

    // 固件标识查找
    function find_patten(target, patten) {
      for (let i = 0; i <= target.length - patten.length; i++) {
        let match = true;
        for (let j = 0; j < patten.length; j++) {
          if (target[i + j] !== patten[j]) {
            match = false;
            break;
          }
        }
        if (match) return i;
      }
      return -1;
    }
    
    // 固件升级
    async function onUpdate() {
      const upfirmButton = document.getElementById('upfirm-button');
      upfirmButton.disabled = true;
      upfirmButton.innerHTML = '<i class="fa fa-spinner fa-spin"></i> 升级中...';
      
      document.getElementById('progress-container').classList.remove('hidden');
      
      let firm_buf, firm_size;

      try {
        console.log('准备打开文件');
        const [handle] = await window.showOpenFilePicker({
          types: [{ description: 'Firm files', accept: { 'text/plain': ['.bin'] } }]
        });
        const file = await handle.getFile();
        let abuf = await readFileAsArrayBuffer(file);
        firm_buf = new Uint8Array(abuf);
        firm_size = file.size;
      } catch (err) {
        console.log('文件读取失败:', err);
        upfirmButton.innerHTML = '<i class="fa fa-refresh"></i> 固件升级';
        upfirmButton.disabled = false;
        document.getElementById('progress-container').classList.add('hidden');
        return;
      }

      let firm_magic = new Uint8Array([0x79, 0x13, 0xa5, 0xf9, 0x86, 0xec, 0x5a, 0x06]);
      let pos = find_patten(firm_buf, firm_magic);
      if (pos == -1) {
        console.log('无效固件: 未找到版本号!');
        upfirmButton.innerHTML = '<i class="fa fa-refresh"></i> 固件升级';
        upfirmButton.disabled = false;
        document.getElementById('progress-container').classList.add('hidden');
        return;
      }

      let firm_ver = firm_buf[pos + 9] * 256 + firm_buf[pos + 8];
      let firm_crc = CRC32.buf(firm_buf);
      console.log('固件版本:', firm_ver, '大小:', firm_size, 'CRC:', (firm_crc >>> 0).toString(16));

      let buf = new Uint8Array(136);
      let view = new DataView(buf.buffer);
      buf[0] = 0xa0;
      view.setUint16(2, firm_size, true);
      await longValue.writeValue(buf);

      let sent = 0;
      const totalSize = firm_size + 64;
      const progressBar = document.getElementById('update_progress_bar');
      const progressText = document.getElementById('update_progress_text');
      
      try {
        for (let i = 0; i < totalSize; i += 256) {
          buf.fill(0xff);
          if (i === 0) {
            view.setUint32(8, 0x00aa5170, true);
            view.setUint32(12, firm_size, true);
            view.setUint32(16, firm_crc, true);
            view.setUint32(36, 0xa50f0000 + firm_ver, true);
            buf[40] = 0;
            buf[0] = 0xa2;
            buf.set(firm_buf.slice(sent, sent + 64), 72);
            await longValue.writeValue(buf);
            sent += 64;
          } else {
            buf[0] = 0xa2;
            buf.set(firm_buf.slice(sent, sent + 128), 8);
            await longValue.writeValue(buf);
            sent += 128;
          }
          buf[0] = 0xa3;
          buf.set(firm_buf.slice(sent, sent + 128), 8);
          await longValue.writeValue(buf);
          sent += 128;

          // 更新进度条
          const progress = Math.min(Math.round(100 * sent / totalSize), 100);
          progressBar.style.width = `${progress}%`;
          progressText.textContent = `${progress}%`;
          document.getElementById('update_progress').textContent = `升级进度: ${progress}%`;
        }

        buf[0] = 0xa4;
        buf.fill(0, 1, 4);
        await longValue.writeValue(buf);
        console.log('升级完成');
      } catch (error) {
        console.log('升级结束，蓝牙已断开');
      } finally {
        upfirmButton.innerHTML = '<i class="fa fa-refresh"></i> 固件升级';
        upfirmButton.disabled = false;
        document.getElementById('progress-container').classList.add('hidden');
      }
    }

	async function onCalibration() {
	  const calibrationButton = document.getElementById('calibration-button');
	  calibrationButton.disabled = true;

	  try {
		let cur_time = await longValue.readValue();
		const last_minute = cur_time.getUint8(5);
		const cal_minute = cur_time.getInt32(7, true);
		console.log('对时后'+cal_minute+'分钟');

		console.log('等待分钟跳变......');
		let minute = last_minute;
		while (minute === last_minute) {
		  cur_time = await longValue.readValue();
		  minute = cur_time.getUint8(5);
		}
		const second = cur_time.getUint8(6);

		const today = new Date();
		let sys_minute = today.getMinutes();
		const sys_second = today.getSeconds();
		console.log('设备时间: '+minute+'分'+second+'秒');
		console.log('系统时间: '+sys_minute+'分'+sys_second+'秒');

		if(cal_minute==-1){
			console.log('请先对时!');
		}else if(cal_minute<2880){
			console.log('对时与校准间隔太短(小于两天)!');
		}else{

			if(minute>sys_minute){
				if(minute-sys_minute>50)
					sys_minute += 60;
			}else{
				if(sys_minute-minute>50)
					minute += 60;
			}

			const diff = (minute*60+second)-(sys_minute*60+sys_second);
			console.log('时间差: '+diff+'秒');

			// 有符号 16 位、小端序——按位运算可确保负数差值得到正确的补码字节
			const buf = new Uint8Array(4);
			buf[0] = 0x92;
			buf[1] = diff & 0xff;
			buf[2] = (diff >> 8) & 0xff;
			buf[3] = 0x00;
			await longValue.writeValue(buf);

			console.log('校准完成');
		}
	  } finally {
		calibrationButton.disabled = false;
	  }
	}

    // 断开连接
    function disconnect() {
      const connectButton = document.getElementById('connect-button');
      connectButton.disabled = true;
      connectButton.innerHTML = '<i class="fa fa-spinner fa-spin"></i> 断开中...';

      setDeviceButtonsEnabled(false);

      // 清除设备时间更新定时器
      if (deviceTimeInterval) {
        clearInterval(deviceTimeInterval);
        deviceTimeInterval = null;
      }
      deviceTimeBase = null;

      if (device && device.gatt.connected) {
        device.gatt.disconnect();
      }
      onDisconnect();
    }

    // 断开回调
    function onDisconnect() {
      device = null;
      connected = false;

      document.getElementById('device_name').textContent = "未连接";
      document.getElementById('current_voltage').textContent = "--.- V";
      document.getElementById('current_time').textContent = "--:--:--";

      const connectButton = document.getElementById('connect-button');
      connectButton.innerHTML = '<i class="fa fa-bluetooth"></i> 连接设备';
      // 只有仍存在可用的蓝牙 radio 时才重新提供连接按钮
      setConnectEnabled(bluetoothAvailable);
      if (!bluetoothAvailable) showStatus(NO_ADAPTER_MSG);

      console.log('设备已断开连接');
    }

    // 预先检查蓝牙是否可用，避免点击连接时才报出难以理解错误
    async function checkBluetoothAvailability() {
      if (!navigator.bluetooth) {
        showStatus(UNSUPPORTED_MSG);
        setConnectEnabled(false);
        console.log('此浏览器不支持 Web Bluetooth');
        return;
      }

      let available;
      try {
        available = await navigator.bluetooth.getAvailability();
      } catch (error) {
        // 旧版浏览器可能未实现 getAvailability。此时宁可放行(保持按钮可用)，
        // 让点击时的报错来说明问题，也不能把按钮永久卡在禁用状态。
        console.log('蓝牙可用性检查失败:', error);
        bluetoothAvailable = true;
        setConnectEnabled(true);
        return;
      }

      bluetoothAvailable = available;
      if (available) {
        hideStatus();
      } else {
        showStatus(NO_ADAPTER_MSG);
        console.log('无可用蓝牙适配器');
      }
      setConnectEnabled(available);
    }

    // 页面打开期间，监听适配器的插入/移除并重新检查
    if (navigator.bluetooth && navigator.bluetooth.addEventListener) {
      navigator.bluetooth.addEventListener('availabilitychanged', (event) => {
        // 无论是否处于连接会话中，都要记录最新状态：若连接期间适配器被拔出，
        // onDisconnect() 会依据该状态保持连接按钮禁用。
        bluetoothAvailable = event.value;
        console.log(event.value ? '检测到蓝牙适配器' : '蓝牙适配器已移除');

        // 连接期间该按钮是"断开连接"控制，保持原样
        if (connected) return;

        if (event.value) hideStatus();
        else showStatus(NO_ADAPTER_MSG);
        setConnectEnabled(event.value);
      });
    }

    checkBluetoothAvailability();

    // 事件绑定
    document.getElementById('connect-button').addEventListener('click', onClick);
    document.getElementById('setime-button').addEventListener('click', onSetTime);
    document.getElementById('upfirm-button').addEventListener('click', onUpdate);
    document.getElementById('calibration-button').addEventListener('click', onCalibration);
  </script>
</body>
</html>
